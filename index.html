<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Star-Chaser</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <h1>⭐ Star-Chaser ⭐</h1>
    <div class="stats" aria-live="polite">
      <span>Score <strong id="score">0</strong></span>
      <span id="bestWrap">Best <strong id="best">0</strong></span>
      <span>Time <strong id="time">45</strong></span>
      <span>Streak <strong id="streak">0</strong></span>
      <span id="bonusWrap">Bonus <strong id="bonus">+0</strong></span>
    </div>
  </div>

  <button id="settingsBtn" type="button" aria-label="Open settings" title="Settings">⚙️</button>

  <section id="startPanel" class="panel" aria-live="polite">
    <h2>Star-Chaser</h2>
    <p id="runSummary">45-second run</p>
    <button id="startBtn" type="button">Start Run</button>
  </section>

  <div id="settingsModal" class="panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" hidden>
    <h2 id="settingsTitle">Settings</h2>
    <label>
      <input type="checkbox" id="vibrateToggle" checked>
      Vibrate on hit
    </label>
    <label>
      <input type="checkbox" id="soundToggle" checked>
      Sound effects
    </label>
    <label>
      <input type="checkbox" id="highScoreToggle" checked>
      Show best score
    </label>
    <button id="closeSettings" type="button">Close</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
